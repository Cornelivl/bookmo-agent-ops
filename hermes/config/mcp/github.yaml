# Optional GitHub MCP template. Prefer local gh auth for scripts when possible.
# If using this server, set GITHUB_PERSONAL_ACCESS_TOKEN in ~/.hermes/.env.

mcp_servers:
  github:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_PERSONAL_ACCESS_TOKEN}"
    tools:
      include:
        - list_issues
        - create_issue
        - update_issue
        - search_code
      resources: false
      prompts: false

